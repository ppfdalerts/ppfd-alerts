name: Publish leaderboard and roster calendars

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/publish-calendar-pages.yml'
      - '.github/scripts/**'
      - 'scripts/personnel_ledger.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout public site sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            docs
            .github/scripts
            scripts
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Keep calendar navigation in the generated leaderboard
        run: python3 .github/scripts/prepare-calendar-site.py
      - name: Upload public site only
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: docs
      - name: Wait for the uploaded site artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          url = (os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
                 + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts?per_page=100')
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          for attempt in range(20):
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      artifacts = json.load(response)['artifacts']
                  matches = [item for item in artifacts
                             if item['name'] == os.environ['PAGES_ARTIFACT_NAME']
                             and str(item['id']) == os.environ['PAGES_ARTIFACT_ID']
                             and not item['expired']]
                  if len(matches) == 1:
                      # The deploy action also reads the Actions results service.
                      time.sleep(5)
                      print('Uploaded site artifact is available for deployment')
                      break
              except urllib.error.HTTPError as error:
                  if error.code != 429 and error.code < 500:
                      raise SystemExit('Artifact lookup failed: HTTP ' + str(error.code))
              except (urllib.error.URLError, TimeoutError):
                  pass
              time.sleep(3)
          else:
              raise SystemExit('Uploaded site artifact did not become available')
          PY
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Retain public incident timelines for future personnel backfills
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/persist_call_archive.py
